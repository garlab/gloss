[workspace]
resolver = "3"

[package]
name = "mdviewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A terminal Markdown viewer with native inline and display equations."
license = "MIT"
publish = false

[dependencies]
document-graphics = { version = "=0.1.8", features = ["images", "sgf"] }
base64 = "0.22"
flate2 = "1.1"
clap = { version = "4", features = ["derive"] }
katex-native = { version = "=0.1.0", features = ["raster"] }
pulldown-cmark = { version = "0.13", default-features = false }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-containerfile = "0.9.2"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.4", default-features = false }
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
