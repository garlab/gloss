name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the version tag and main ancestry
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Run this workflow on tag v$version, matching Cargo.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main; push main before releasing"
            exit 1
          fi

  verify:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check whether the version is already published
        id: registry
        run: |
          status=$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 --retry 3 \
            --user-agent 'gloss release (github.com/garlab/gloss)' \
            "https://crates.io/api/v1/crates/gloss-cli/${TAG#v}")
          case "$status" in
            200)
              echo "gloss-cli ${TAG#v} is already on crates.io"
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected crates.io response: HTTP $status"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.registry.outputs.exists == 'false'
        id: auth
      # CI already built the package from this commit. Avoid running dependency
      # build scripts and procedural macros with the publishing token present.
      - name: Publish to crates.io
        if: steps.registry.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p gloss-cli --locked --no-verify
