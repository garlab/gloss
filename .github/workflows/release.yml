name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Serialise versions as well as retries, so older runs cannot move latest back.
concurrency:
  group: gloss-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Check the version tag, main ancestry and release order
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/release.py check "$TAG"

  verify:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  # Attested here, not in a reusable workflow: the Homebrew tap verifies this
  # file as the signer of each asset.
  source:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/release.py archive "$TAG" "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check whether the version is already published
        id: registry
        run: |
          status=$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 --retry 3 \
            --user-agent 'gloss release (github.com/garlab/gloss)' \
            "https://crates.io/api/v1/crates/gloss-cli/${TAG#v}")
          case "$status" in
            200)
              echo "gloss-cli ${TAG#v} is already on crates.io"
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected crates.io response: HTTP $status"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.registry.outputs.exists == 'false'
        id: auth
      # CI already built the package from this commit. Avoid running dependency
      # build scripts and procedural macros with the publishing token present.
      - name: Publish to crates.io
        if: steps.registry.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p gloss-cli --locked --no-verify

  release:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-release
          path: ${{ runner.temp }}/release
      - name: Publish immutable release (identical retries are safe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/release.py publish "$TAG" "$RUNNER_TEMP/release"

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: garlab
          repositories: homebrew-tap
          permission-contents: write
      - name: Notify tap (the tap independently verifies the release)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          jq -n --arg tag "$TAG" '{event_type: "gloss-release", client_payload: {tag: $tag}}' |
            gh api repos/garlab/homebrew-tap/dispatches --input -
